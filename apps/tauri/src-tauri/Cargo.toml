[package]
name = "dte-desktop"
version = "1.0.0"
description = "DEMON TIME EXOTICS — THE MESSY SHOW desktop app (Tauri 2)"
authors = ["Demon Time Exotics <Bigmoney@demontimeexotics.com>"]
license = "MIT"
repository = "https://github.com/DTEMONEY448/demon-time-exotics"
default-run = "dte-desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# The custom-protocol feature enables production assets baked into the binary.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
