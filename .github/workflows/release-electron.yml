name: Release Electron Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build & package Electron app
        run: pnpm --filter @dte/electron run package
        env:
          # macOS code signing / notarization (optional — unset = unsigned build)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Publish straight to this repo's GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: ls -R apps/electron/release || true
        shell: bash

      - name: Upload artifacts to release
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            apps/electron/release/*.exe
            apps/electron/release/*.dmg
            apps/electron/release/*.AppImage
            apps/electron/release/*.snap
            apps/electron/release/*.deb
          retention-days: 90
          if-no-files-found: ignore

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/electron/release/*.exe
            apps/electron/release/*.dmg
            apps/electron/release/*.AppImage
            apps/electron/release/*.snap
            apps/electron/release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
