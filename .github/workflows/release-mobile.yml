name: Release Mobile App (EAS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    name: EAS Build — Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (Android)
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-ios:
    name: EAS Build — iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (iOS — cloud)
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}"
          eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  export-web:
    name: Mobile web export (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export
        run: pnpm --filter @dte/mobile export -- --platform web || true

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-export
          path: apps/mobile/dist/
          retention-days: 30
          if-no-files-found: ignore
